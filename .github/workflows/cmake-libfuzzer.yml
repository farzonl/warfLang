name: CMake Libfuzzer Release

on:
  workflow_dispatch:
    inputs:
      timeout:
        description: 'Overall fuzzing wall-clock timeout in seconds (split across fuzzers)'
        required: false
        default: '180'
        type: string
  push:
    branches:
      - master
    paths:
      - '**.cpp'
      - '**.h'
      - '**CMakeLists.txt'
      - 'scripts/runLibFuzzers.py'
      - 'scripts/geneticFuzzer.py'
      - .github/workflows/cmake-libfuzzer.yml
  pull_request:
    branches:
      - '**'
    paths:
      - '**.cpp'
      - '**.h'
      - '**CMakeLists.txt'
      - 'scripts/runLibFuzzers.py'
      - 'scripts/geneticFuzzer.py'
      - .github/workflows/cmake-libfuzzer.yml

permissions:
  contents: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
  CORPUS_BRANCH: fuzz-corpus

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # windows-2019 and macos-13 have been decommissioned by GitHub Actions;
        # jobs requesting them just sit queued forever waiting for a runner
        # that will never be allocated. Use the current supported images.
        os: [ubuntu-latest, macos-15, windows-2022]
        include:
          - os: windows-2022
            artifact_exec_ext: .exe
            artifact_os_name: Windows
            artifact_arch: x86_64
    steps:
    - uses: actions/checkout@v2
    - name: Cache Linux apt packages
      if: matrix.os == 'ubuntu-latest'
      uses: actions/cache@v3
      with:
        path: ${{ github.workspace }}/apt-cache
        key: ${{ runner.os }}-libfuzzer-apt-cache-v1-${{ hashFiles('.github/workflows/cmake-libfuzzer.yml') }}
        restore-keys: |
          ${{ runner.os }}-libfuzzer-apt-cache-v1-
    - name: Install Dependencies (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        if compgen -G "${{ github.workspace }}/apt-cache/*.deb" > /dev/null && sudo DEBIAN_FRONTEND=noninteractive dpkg -i "${{ github.workspace }}/apt-cache"/*.deb; then
          echo "Installed Linux dependencies from cached .deb archives"
        else
          sudo rm -f /etc/apt/apt.conf.d/docker-clean
          mkdir -p "${{ github.workspace }}/apt-cache/partial"
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends --no-upgrade \
            -o Dpkg::Use-Pty=0 \
            -o APT::Keep-Downloaded-Packages=true \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            -o Dir::Cache::archives="${{ github.workspace }}/apt-cache" \
            llvm clang libedit-dev ninja-build
        fi
        sudo rm -rf "${{ github.workspace }}/apt-cache/lock" "${{ github.workspace }}/apt-cache/partial"
        mkdir -p "${{ github.workspace }}/apt-cache"
        sudo chown -R "$USER:$USER" "${{ github.workspace }}/apt-cache"
    - name: Install Dependencies (Mac)
      if: matrix.os == 'macos-15'
      run: |
        brew install llvm ninja
    - name: Install Dependencies (Windows)
      if: matrix.os == 'windows-2022'
      run: |
        choco install llvm ninja
  
    - name: Create Build Environment
      # Some projects don't allow in-source building, so create a separate build directory
      # We'll use this as our working directory for all subsequent commands
      run: cmake -E make_directory ${{github.workspace}}/build

    - name: Cache C++ dependencies in Packages Directory
      uses: actions/cache@v3
      with:
        path: |
          packages
        key: ${{ runner.OS }}-c++-packages-cache-libfuzzer-Release-${{ hashFiles('depsCache.json') }}
        restore-keys: |
          ${{ runner.OS }}-c++-packages-cache-libfuzzer-Release-

    - name: Configure CMake (Mac)
      shell: bash
      working-directory: ${{github.workspace}}/build
      if: matrix.os == 'macos-15'
      # Mac needs brew's llvm to override AppleClang; use `brew --prefix` since
      # the install path differs between Apple Silicon (/opt/homebrew) and Intel (/usr/local).
      run: |
        export PATH="$(brew --prefix llvm)/bin:$PATH"
        cmake -G Ninja $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
        -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DBUILD_FUZZER=true
      
    - name: Configure CMake
      # Use a bash shell so we can use the same syntax for environment variable
      # access regardless of the host operating system
      shell: bash
      working-directory: ${{github.workspace}}/build
      if: matrix.os != 'macos-15'
      # Note the current convention is to use the -S and -B options here to specify source 
      # and build directories, but this is only available with CMake 3.13 and higher.  
      # The CMake binaries on the Github Actions machines are (as of this writing) 3.12
      run: |
        cmake -G Ninja $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
        -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DBUILD_FUZZER=true
    
    - name: Build
      working-directory: ${{github.workspace}}/build
      shell: bash
      # Execute the build.  You can specify a specific target with "--target <NAME>"
      run: cmake --build . --config $BUILD_TYPE
    - name: Set variables (Mac\Linux)
      if: matrix.os == 'ubuntu-latest' || matrix.os == 'macos-15'
      run: |
        APP=$(cat $GITHUB_WORKSPACE/src/lib/Version/appName.txt)
        VER=$(cat $GITHUB_WORKSPACE/src/lib/Version/version.txt)
        echo "VERSION=$VER" >> $GITHUB_ENV
        echo "APPNAME=$APP" >> $GITHUB_ENV

    - name: Set variables (Windows)
      if: matrix.os == 'windows-2022'
      run: |
        $APP = type .\src\lib\Version\appName.txt
        $VER = type .\src\lib\Version\version.txt
        echo "VERSION=$VER" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append
        echo "APPNAME=$APP" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append

    - name: Prepare Binaries for upload (Mac\Linux)
      if: matrix.os == 'ubuntu-latest' || matrix.os == 'macos-15'
      shell: bash
      run:  |
        mkdir ${{github.workspace}}/artifacts
        cp build/fuzz/*Fuzzer ${{github.workspace}}/artifacts
        if [ "$(uname -s)" = "Darwin" ]; then
          export PATH="$(brew --prefix llvm)/bin:$PATH"
          for f in ${{github.workspace}}/artifacts/*Fuzzer; do
            dsymutil "$f" || true
          done
        fi
        pushd ${{github.workspace}}
        zip -r ${{ env.APPNAME }}-$(uname -s)-libfuzzers-$(uname -m).zip artifacts
        popd
    - name: Prepare Binaries for upload (windows)
      if: matrix.os == 'windows-2022'
      shell: powershell
      run: |
        [system.io.directory]::CreateDirectory("${{github.workspace}}/artifacts")
        Copy-Item "build/fuzz/*Fuzzer${{ matrix.artifact_exec_ext }}" -Destination "${{github.workspace}}/artifacts"
        Get-ChildItem -Path "build/fuzz/*.pdb" -ErrorAction SilentlyContinue | Copy-Item -Destination "${{github.workspace}}/artifacts"
        $asanDll = Get-ChildItem -Path "C:\Program Files\LLVM\lib\clang\*\lib\windows\clang_rt.asan_dynamic-x86_64.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
        if ($asanDll) {
          Copy-Item $asanDll.FullName -Destination "${{github.workspace}}/artifacts"
        }
        Compress-Archive -Path ${{github.workspace}}/artifacts/* -DestinationPath ${{ env.APPNAME }}-${{matrix.artifact_os_name}}-libfuzzers-${{matrix.artifact_arch}}.zip
    - name: 'Upload Pull Request Artifact'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.APPNAME }} Pull Request Artifacts (${{ matrix.os }})
        path: ${{ env.APPNAME }}-*.zip
        retention-days: 5
    - name: Upload binaries to Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/heads/master')
      with:
        tag_name: ${{ env.APPNAME }}-${{ env.VERSION }}
        files: |
          ${{ env.APPNAME }}-*.zip

  fuzz:
    needs: [build]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-2022]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Linux runtime apt packages
        if: matrix.os == 'ubuntu-latest'
        uses: actions/cache@v3
        with:
          path: ${{ github.workspace }}/apt-cache
          key: ${{ runner.os }}-libfuzzer-runtime-apt-cache-v1-${{ hashFiles('.github/workflows/cmake-libfuzzer.yml') }}
          restore-keys: |
            ${{ runner.os }}-libfuzzer-runtime-apt-cache-v1-

      - name: Install Runtime Dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          if compgen -G "${{ github.workspace }}/apt-cache/*.deb" > /dev/null && sudo DEBIAN_FRONTEND=noninteractive dpkg -i "${{ github.workspace }}/apt-cache"/*.deb; then
            echo "Installed Linux runtime dependencies from cached .deb archives"
          else
            sudo rm -f /etc/apt/apt.conf.d/docker-clean
            mkdir -p "${{ github.workspace }}/apt-cache/partial"
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends --no-upgrade \
              -o Dpkg::Use-Pty=0 \
              -o APT::Keep-Downloaded-Packages=true \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30 \
              -o Dir::Cache::archives="${{ github.workspace }}/apt-cache" \
              llvm libedit-dev unzip python3
          fi
          sudo rm -rf "${{ github.workspace }}/apt-cache/lock" "${{ github.workspace }}/apt-cache/partial"
          mkdir -p "${{ github.workspace }}/apt-cache"
          sudo chown -R "$USER:$USER" "${{ github.workspace }}/apt-cache"

      - name: Install Runtime Dependencies (Mac)
        if: matrix.os == 'macos-15'
        run: |
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH

      - name: Install Runtime Dependencies (Windows)
        if: matrix.os == 'windows-2022'
        run: |
          choco install llvm

      - name: Download Libfuzzer Artifact
        uses: actions/download-artifact@v4
        with:
          name: Warf Pull Request Artifacts (${{ matrix.os }})
          path: fuzzer-artifact

      - name: Restore persistent fuzz corpus from ${{ env.CORPUS_BRANCH }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git ls-remote --exit-code --heads origin "${CORPUS_BRANCH}" >/dev/null 2>&1; then
            git clone --depth=1 --branch "${CORPUS_BRANCH}" \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" fuzz-corpus
          else
            mkdir -p fuzz-corpus
            git -C fuzz-corpus init
            git -C fuzz-corpus checkout --orphan "${CORPUS_BRANCH}"
            git -C fuzz-corpus remote add origin \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi
          mkdir -p fuzz-corpus/libfuzzer
          EXISTING_COUNT=$(find fuzz-corpus/libfuzzer -type f ! -name '*.json' | wc -l | tr -d ' ')
          echo "Restored ${EXISTING_COUNT} persistent libFuzzer corpus inputs from ${CORPUS_BRANCH}."

      - name: Run libFuzzers
        shell: bash
        run: |
          TIMEOUT="${{ inputs.timeout || '180' }}"
          if [ "${RUNNER_OS}" = "Windows" ]; then
            PYTHON_BIN="python"
          else
            PYTHON_BIN="python3"
          fi
          "$PYTHON_BIN" scripts/runLibFuzzers.py \
            --artifact-dir fuzzer-artifact \
            --corpus-root fuzz-corpus/libfuzzer \
            --seed-dir "test/filecheck,fuzz-corpus/corpus" \
            --output-dir fuzz-output \
            --timeout "${TIMEOUT}"

      - name: Upload libFuzzer output artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libfuzzer-output-${{ matrix.os }}-${{ github.run_id }}
          path: fuzz-output/
          retention-days: 14

      - name: Merge and persist corpus to ${{ env.CORPUS_BRANCH }} branch
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p fuzz-corpus/libfuzzer
          if [ -d fuzz-output/corpus ]; then
            cp -rf fuzz-output/corpus/* fuzz-corpus/libfuzzer/ 2>/dev/null || true
          fi
          if [ -f "fuzz-output/summary-${RUNNER_OS}.json" ]; then
            cp -f "fuzz-output/summary-${RUNNER_OS}.json" "fuzz-corpus/libfuzzer/summary-${RUNNER_OS}.json" 2>/dev/null || true
          fi

          cd fuzz-corpus
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add libfuzzer

          TOTAL_CORPUS=$(find libfuzzer -type f ! -name '*.json' | wc -l | tr -d ' ')
          if git diff --cached --quiet; then
            echo "No libFuzzer corpus changes to push (${TOTAL_CORPUS} total corpus inputs)."
          else
            git commit -m "Update libFuzzer corpus on ${RUNNER_OS} (${TOTAL_CORPUS} inputs, run ${GITHUB_RUN_ID})"
            PUSHED=0
            for attempt in 1 2 3 4 5; do
              if git push origin "HEAD:refs/heads/${CORPUS_BRANCH}"; then
                PUSHED=1
                break
              fi
              echo "Push attempt ${attempt} failed due to concurrent update; fetching and merging..."
              sleep $((attempt * 2))
              git fetch origin "${CORPUS_BRANCH}"
              git checkout -B "${CORPUS_BRANCH}" "origin/${CORPUS_BRANCH}"
              mkdir -p libfuzzer
              if [ -d ../fuzz-output/corpus ]; then
                cp -rf ../fuzz-output/corpus/* libfuzzer/ 2>/dev/null || true
              fi
              if [ -f "../fuzz-output/summary-${RUNNER_OS}.json" ]; then
                cp -f "../fuzz-output/summary-${RUNNER_OS}.json" "libfuzzer/summary-${RUNNER_OS}.json" 2>/dev/null || true
              fi
              git add libfuzzer
              if git diff --cached --quiet; then
                PUSHED=1
                break
              fi
              git commit -m "Update libFuzzer corpus on ${RUNNER_OS} (${TOTAL_CORPUS} inputs, run ${GITHUB_RUN_ID})"
            done
            if [ "${PUSHED}" -eq 1 ]; then
              echo "Persisted ${TOTAL_CORPUS} libFuzzer corpus inputs to ${CORPUS_BRANCH}."
            else
              echo "Warning: could not push corpus after retries." >&2
            fi
          fi

      - name: File deduplicated GitHub issues for discovered findings
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${RUNNER_OS}" = "Windows" ]; then
            PYTHON_BIN="python"
          else
            PYTHON_BIN="python3"
          fi
          if [ -f fuzz-output/summary.json ]; then
            "$PYTHON_BIN" scripts/runLibFuzzers.py \
              --file-github-issues-from fuzz-output/summary.json \
              --repo "${GITHUB_REPOSITORY}" \
              --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi
